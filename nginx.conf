# Конфигурация статического сервера для прод-сборки.
#
# Задача — отдавать собранные хешированные файлы без сюрпризов: с правильным типом,
# с долгим кэшем для неизменяемых имён и без кэша для index.html, который ссылается
# на новые имена после каждой сборки.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Сжимаем текстовые ответы: бандл ~460 КБ, gzip сокращает его до ~141 КБ
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Файлы с хешем в имени не меняются между релизами — кэшируем надолго
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html — точка входа: он обязан проверяться заново, иначе браузер
  # продолжит ссылаться на удалённые ассеты предыдущей сборки
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA-fallback: маршрут приложения отдаёт тот же index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Не сообщаем версию сервера: лишняя информация о стеке
  server_tokens off;
}
